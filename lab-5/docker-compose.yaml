services:
  mysql:
    image: mysql:9.5.0
    container_name: mysql
    restart: always
    env_file:
      - ./react-spring-app/.env
    volumes:
      - mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    image: lab4back
    container_name: backend
    restart: always
    env_file:
      - ./react-spring-app/.env
    environment:
      DB_HOST: mysql
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    image: lab4front
    container_name: frontend
    restart: always
    env_file:
      - ./react-spring-app/react-frontend/.env

  nginx:
    image: nginx:1.29.3-alpine
    container_name: nginx
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
      - frontend

volumes:
  mysql:
