workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push"'

.docker_setup:
  image: docker:28.5.1
  services: ["docker:28.5.1-dind"]
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: ""
    DOCKER_BUILDKIT: 1
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - docker buildx create --use --name ci-builder || docker buildx use ci-builder
    - docker buildx inspect --bootstrap

.docker_build_template:
  extends: .docker_setup
  stage: build
  variables:
    BUILDX_CACHE_REPO: "$CI_REGISTRY_IMAGE/build-cache"
    BUILD_CONTEXT: .
    IMAGE_TAGS: "$CI_COMMIT_SHORT_SHA latest"
    TARGET: ""
  script:
    - |
      TAGS=""

      for tag in $IMAGE_TAGS; do
        TAGS="$TAGS --tag $CI_REGISTRY_IMAGE/$IMAGE_NAME:$tag"
      done

      if [ -n "$CI_COMMIT_TAG" ]; then
        TAGS="$TAGS --tag $CI_REGISTRY_IMAGE/$IMAGE_NAME:$CI_COMMIT_TAG"
      fi
    - |
      TARGET_ARG=""

      if [ -n "$TARGET" ]; then
        TARGET_ARG="--target $TARGET"
      fi
    - |
      docker buildx build \
        --pull \
        $TARGET_ARG \
        --file "$DOCKERFILE_PATH" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --cache-from "type=registry,ref=$BUILDX_CACHE_REPO:latest" \
        --cache-to "type=registry,ref=$BUILDX_CACHE_REPO:latest,mode=max" \
        $TAGS \
        "$BUILD_CONTEXT" \
        --push
  after_script:
    - docker buildx rm ci-builder || true
    - docker logout "$CI_REGISTRY" || true
